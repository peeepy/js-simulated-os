<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Environment</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>

<body>

    <div class="desktop-container">
        <div class="desktop" id="desktop"></div>
    </div>

    <div id="start-menu-container" class="hidden">
        <div class="menu">
            <div class="menu-sidebar">
                <div class="menu-item">
                    <p>System</p>
                </div>
                <div class="menu-item">
                    <p>Documents</p>
                </div>
            </div>
            <div class="menu-main">
                <div class="menu-apps-header">
                    <p>System</p>
                    <div class="search-container">
                        <input type="text" placeholder="Search" />
                    </div>
                </div>
                <div class="app-container"></div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-icon pinned" id="start-menu-button">
            <img src="assets/Icon_512x512_Normallpad.png" />
        </div>
        <div class="taskbar-pinned">
            <!-- Pinned applications -->
            <div class="taskbar-icon pinned" data-app="explorer">
                <img src="assets/folder-mac.png" />
            </div>
        </div>
        <div class="taskbar-windows"></div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
</body>

</html>
